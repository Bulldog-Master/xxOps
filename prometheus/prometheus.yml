global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/xxops-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["__MONITOR_IP__:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["__MONITOR_IP__:3000"]

  - job_name: monitor-host
    static_configs:
      - targets: ["127.0.0.1:9100"]
