<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join xxOps</title><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0E131C;color:#E6EAF2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
.card{width:100%;max-width:380px;background:#161D2B;border:1px solid #263144;
  border-radius:16px;padding:26px}
h1{margin:0 0 6px;font-size:20px}
p.sub{margin:0 0 20px;opacity:.62;font-size:13px}
label{display:block;font-size:12px;opacity:.7;margin:14px 0 6px}
input{width:100%;background:#1E2738;border:1px solid #263144;border-radius:9px;
  padding:11px;color:inherit;font:inherit}
input:focus{outline:none;border-color:#5b6cff}
button{width:100%;margin-top:20px;background:#5b6cff;border:0;border-radius:9px;
  padding:12px;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:13px;min-height:18px}
.bad{color:#ff7b72}
.ok{color:#3fb950}
</style></head><body><div class="card">
<h1>Join xxOps</h1>
<p class="sub">Enter the code you were sent, then choose how you want to sign in.</p>
<label for="c">Invitation code</label><input id="c" autocapitalize="off" autocomplete="off">
<label for="u">Choose a username</label><input id="u" autocapitalize="off" autocomplete="username">
<label for="p">Choose a password</label><input id="p" type="password" autocomplete="new-password">
<label for="p2">Password again</label><input id="p2" type="password" autocomplete="new-password">
<button id="go">Create my account</button>
<div class="msg" id="m"></div>
</div><script>
const $=i=>document.getElementById(i);
const say=(t,bad)=>{$("m").textContent=t;$("m").className="msg"+(bad?" bad":" ok")};
const q=new URLSearchParams(location.search).get("code");
if(q) $("c").value=q;
$("go").onclick=async()=>{
  const p=$("p").value;
  if(p!==$("p2").value) return say("Those passwords do not match.",1);
  if(p.length<8) return say("Use at least 8 characters.",1);
  $("go").disabled=true; say("Creating your account\u2026");
  try{
    const r=await fetch("/api/auth/redeem",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:$("c").value,username:$("u").value,password:p})});
    const d=await r.json();
    if(!d.ok){ $("go").disabled=false; return say(d.message||"That did not work.",1); }
    say("Done \u2014 signing you in\u2026");
    location.href="/";
  }catch(e){ $("go").disabled=false; say("The server did not answer.",1); }
};
</script></body></html>
