# Run the test suite on every push and pull request.
#
# This does not block anything. It is evidence, not a gate: a green tick
# beside a commit saying the security regression tests reproduced, without
# anyone having to remember to run them. Making it required is a separate
# decision, and one that changes how releases work.
#
# Actions are pinned to commit SHAs rather than tags. A tag is a moving
# pointer; if it is ever repointed, a workflow that names it runs whatever it
# now points at. That matters more here than in most repositories.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # actions/checkout v4.1.7
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Python version
        run: python3 --version

      - name: Server and agent tests
        # run.py already exits non-zero on failure, so no extra plumbing.
        # Some tests skip without promtool/amtool; that is expected here and
        # the run is still meaningful - the authorization and session tests
        # do not need them.
        run: python3 tests/run.py

      - name: Shell scripts parse
        # bash -n alone would NOT have caught the real bug here: a block of
        # shell landed inside die()'s printf string, which is malformed but
        # still valid shell. So also check that every function definition is
        # a single line that ends where it should.
        run: |
          for f in install-monitor.sh agent/install.sh agent/uninstall.sh \
                   fixes/xxops-host-install.sh backup/xxops-backup.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "ok  $f"
          done
          python3 - <<'CHECK'
          import sys
          bad = []
          for f in ("install-monitor.sh", "agent/install.sh"):
              for n, line in enumerate(open(f), 1):
                  if line.startswith(("die()", "say()")) and not line.rstrip().endswith("}"):
                      bad.append("%s:%d %s" % (f, n, line.strip()[:60]))
          if bad:
              print("a one-line function is no longer one line:")
              print("\n".join(bad)); sys.exit(1)
          print("ok  helper functions are intact")
          CHECK

      - name: App JavaScript tests
        # node is present on ubuntu-latest. If it ever is not, this step
        # should fail loudly rather than pass quietly - a skipped test that
        # looks green is worse than a red one.
        run: |
          node --version
          node tests/app_tests.js
